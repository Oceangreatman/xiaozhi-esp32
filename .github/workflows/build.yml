name: Build Labplus mPython V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build labplus-mpython-v2
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find Labplus mPython V2 variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh

          VARIANT_NAME=$(python scripts/build.py --list-boards --json | \
            python -c '
          import json, sys
          boards = json.load(sys.stdin)
          matches = [x for x in boards if x["board"] == "labplus-mpython-v2"]

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one labplus-mpython-v2 variant, found %d" % len(matches)
              )

          print(matches[0]["name"])
          ')

          echo "VARIANT_NAME=$VARIANT_NAME" >> "$GITHUB_ENV"
          echo "Building variant: $VARIANT_NAME"

      - name: Build labplus-mpython-v2
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py labplus-mpython-v2 --name "$VARIANT_NAME"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_labplus-mpython-v2_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
